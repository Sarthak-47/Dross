name: Bug report
description: Dross crashed, hung, or did something other than report findings
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The exact commands, including whether `dross index` had been run.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `dross --version`, or the desktop app's version.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Linux, macOS, Windows]
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: >
        `dross check --staged --format json` if it runs at all. Redact anything
        you would not want public — Dross never sends this anywhere, but an
        issue is public.
      render: shell
