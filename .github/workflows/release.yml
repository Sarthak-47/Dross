name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  # Build provenance. The binaries are unsigned — no Apple Developer ID, no
  # Windows EV certificate — so Gatekeeper and SmartScreen will warn either
  # way. What this does give is a signed, verifiable statement of which
  # workflow, at which commit, produced each file:
  #
  #     gh attestation verify dross-x86_64-unknown-linux-gnu --repo Sarthak-47/Dross
  #
  # That answers "did this come from the source I can read", which is the
  # question a code-signing certificate would otherwise be the only way to ask.
  id-token: write
  attestations: write

jobs:
  build-cli:
    name: CLI (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --locked -p dross-cli --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp "target/${{ matrix.target }}/release/dross.exe" "dist/dross-${{ matrix.target }}.exe"
          else
            cp "target/${{ matrix.target }}/release/dross" "dist/dross-${{ matrix.target }}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dross-${{ matrix.target }}
          path: dist/*

  build-desktop:
    name: Desktop installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            args: ""
          - os: macos-latest
            args: "--target universal-apple-darwin"
          - os: windows-latest
            args: ""
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install Tauri system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Install frontend dependencies
        run: npm ci --prefix apps/desktop

      # `tagName` is deliberately omitted so this step only builds. Letting
      # tauri-action create the release made three parallel jobs race to create
      # the same one, and it needs a write-scoped token to do it — a build
      # should not fail because of either. Publishing happens once, below.
      - uses: tauri-apps/tauri-action@v0
        with:
          projectPath: apps/desktop
          args: ${{ matrix.args }}

      - name: Collect installers
        shell: bash
        run: |
          mkdir -p dist
          # Searched from the workspace root rather than target/release: the
          # macOS entry builds a universal binary, which bundles under its own
          # target directory instead.
          #
          # One -name per extension rather than a single -regex: macOS ships BSD
          # find, whose -regex takes a POSIX basic RE with no alternation, so a
          # GNU-style `\|` pattern matched nothing there and the job uploaded an
          # empty directory. -path and -name are portable across both.
          for ext in deb rpm AppImage dmg msi exe; do
            find target -type f -path '*/bundle/*' -name "*.$ext" \
              -exec cp -n {} dist/ ';'
          done
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: [build-cli, build-desktop]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Written before the attestation so the file is covered by it too.
      # Built outside dist/ and moved in, so a re-run cannot checksum the
      # previous run's checksum file.
      - name: Checksums
        run: |
          cd dist
          rm -f SHA256SUMS.txt
          sha256sum -- * > ../SHA256SUMS.txt
          mv ../SHA256SUMS.txt .
          cat SHA256SUMS.txt

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*

      # The single publishing step: every binary and installer from the matrix
      # above lands in one draft release.
      #
      # This needs a write-scoped GITHUB_TOKEN, requested in the `permissions`
      # block above. That request is honoured even when the repository default
      # under Settings -> Actions -> General is read-only — verified on the
      # v0.1.4 and v1.0.0 releases, both of which created their draft from a
      # repository set to read-only defaults.
      #
      # It is left as a draft on purpose. Publishing is the one step that
      # should follow a human downloading an artifact and running it.
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: true
          generate_release_notes: true
