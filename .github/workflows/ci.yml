name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace --all-targets

      # The engine's whole value proposition is determinism: the same diff must
      # produce byte-identical findings across platforms and repeated runs.
      - name: Verify deterministic output
        shell: bash
        run: |
          cargo build --release
          BIN="target/release/dross"
          [ -f "$BIN.exe" ] && BIN="$BIN.exe"
          "$BIN" --version
          "$BIN" check --worktree --format json > run1.json
          "$BIN" check --worktree --format json > run2.json
          python3 - <<'PY'
          import json, sys
          a = json.load(open("run1.json"))
          b = json.load(open("run2.json"))
          # duration_ms legitimately varies between runs; findings must not.
          for doc in (a, b):
              doc.pop("duration_ms", None)
          if a != b:
              print("non-deterministic output between identical runs", file=sys.stderr)
              sys.exit(1)
          print(f"deterministic: {len(a['findings'])} finding(s) reproduced exactly")
          PY

  msrv:
    name: minimum supported rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
