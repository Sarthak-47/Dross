name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # The engine, CLI, adapters, and benchmark harness have no system
  # dependencies, so they run on all three platforms cheaply. The desktop crate
  # needs a GTK/WebKit toolchain and is built separately.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: >
          cargo clippy
          -p dross-core -p dross-cli -p dross-adapters -p dross-bench
          --all-targets -- -D warnings

      - name: Test
        run: >
          cargo test
          -p dross-core -p dross-cli -p dross-adapters -p dross-bench
          --all-targets

      # Reproducibility is the tool's central claim, so it is enforced rather
      # than asserted: the same diff analyzed twice must match exactly.
      - name: Verify deterministic output
        shell: bash
        run: |
          cargo build --release -p dross-cli
          BIN="target/release/dross"
          [ -f "$BIN.exe" ] && BIN="$BIN.exe"
          "$BIN" --version
          "$BIN" check --worktree --format json > run1.json
          "$BIN" check --worktree --format json > run2.json
          python3 - <<'PY'
          import json, sys
          a = json.load(open("run1.json"))
          b = json.load(open("run2.json"))
          # Timing legitimately varies between runs; findings must not.
          for doc in (a, b):
              doc.pop("duration_ms", None)
          if a != b:
              print("non-deterministic output between identical runs", file=sys.stderr)
              sys.exit(1)
          print(f"deterministic: {len(a['findings'])} finding(s) reproduced exactly")
          PY

  desktop:
    name: desktop app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Install frontend dependencies
        run: npm ci --prefix apps/desktop

      - name: Frontend tests
        run: npm test --prefix apps/desktop

      - name: Type-check and build frontend
        run: npm run build --prefix apps/desktop

      - name: Clippy (desktop backend)
        run: cargo clippy -p dross-desktop --all-targets -- -D warnings

      - name: Build desktop backend
        run: cargo build -p dross-desktop

  msrv:
    name: minimum supported rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      # The desktop crate is excluded: Tauri tracks its own MSRV, and the
      # figure that matters to someone installing the CLI is the CLI's.
      - run: cargo check -p dross-core -p dross-cli -p dross-adapters -p dross-bench

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    # audit-check reports through the Checks API, which the repository default
    # token cannot write. Without this the audit passed and the job still
    # failed, on "Resource not accessible by integration".
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
