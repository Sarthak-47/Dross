name: Pages

# Publishes the landing page in site/ to GitHub Pages.
#
# configure-pages runs with enablement: true, so the first run turns Pages on
# by itself (source: GitHub Actions) — no manual setting needed. If an account
# or org policy forbids the workflow from enabling Pages, enable it once by hand
# at Settings -> Pages -> Source -> "GitHub Actions" and re-run.

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
