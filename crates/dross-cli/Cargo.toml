[package]
name = "dross-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "CLI for Dross — deterministic pre-commit checks for agent-generated diffs"

[[bin]]
name = "dross"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
colored = "3.1.1"
dross-adapters = { version = "0.1.0", path = "../dross-adapters" }
dross-core = { version = "0.1.0", path = "../dross-core" }
serde_json = "1.0.151"
