[package]
name = "dross-desktop"
description = "Dross desktop app — the primary surface for reviewing agent-generated diffs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version = "1.88"

[lib]
name = "dross_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3" }

[dependencies]
anyhow = "1"
dross-adapters = { path = "../../../crates/dross-adapters" }
dross-core = { path = "../../../crates/dross-core" }
log = "0.4"
notify = "8.2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.3" }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-log = "2"
